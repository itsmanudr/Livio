<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livio</title><link rel="stylesheet" href="style.css"></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.6l2 2.2h7.4a2 2 0 0 1 2 2v7.3a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path d="M12 10.8v5M9.5 13.3h5"/></symbol>
<symbol id="i-spk" viewBox="0 0 24 24"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path d="M15.2 9a4.2 4.2 0 0 1 0 6M17.8 6.6a7.6 7.6 0 0 1 0 10.8"/></symbol>
<symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></symbol>
<symbol id="i-live" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-dasharray="2.1 2.5"/><circle cx="12" cy="12" r="6.3"/><circle cx="12" cy="12" r="2.3" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.2"/><circle cx="12" cy="7.9" r=".7" fill="currentColor"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6.5" width="13" height="11" rx="3"/><path d="M16 11l5-3v8l-5-3z"/></symbol>
<symbol id="i-photos" viewBox="0 0 64 64"><rect x="9" y="14" width="46" height="36" rx="7"/><circle cx="23" cy="26" r="4"/><path d="M11 45l12-11 9 8 9-9 13 12"/></symbol></svg>
<div id="app">
<header class="topbar" id="topbar"><span></span><div class="compact">Library</div>
<button class="glass icon-btn" id="btnOpen" type="button" title="Open folder (Ctrl+O)"><svg class="i"><use href="#i-folder"/></svg></button></header>
<main class="scroller" id="scroller"><div class="large"><h1>Library</h1><p id="subtitle"></p></div>
<div class="grid" id="grid" hidden></div><p class="none" id="none" hidden>Nothing in this category</p>
<section class="empty" id="empty"><svg class="empty-icon"><use href="#i-photos"/></svg><h2>No photos</h2>
<p>Open the folder with the photos copied from your iPhone. Each photo with its .MOV video becomes a Live Photo.</p>
<button class="prominent" id="btnOpen2" type="button">Open folder…</button></section></main>
<div class="rail" id="rail" hidden><div class="rail-thumb" id="railThumb"></div><div class="glass rail-bubble" id="railBubble"></div></div>
<nav class="glass tabbar" id="tabbar"><span class="thumb"></span>
<button type="button" data-f="all" aria-pressed="true">All</button><button type="button" data-f="live" aria-pressed="false">Live</button><button type="button" data-f="photo" aria-pressed="false">Photos</button><button type="button" data-f="video" aria-pressed="false">Videos</button></nav>
<div class="viewer" id="viewer" hidden><div class="v-stage" id="vStage"><div class="v-track" id="vTrack"></div></div>
<div class="v-top chrome"><button class="glass icon-btn" id="vBack" type="button"><svg class="i"><use href="#i-back"/></svg></button>
<div class="v-title" id="vTitle"></div>
<div class="v-right"><button class="glass icon-btn" id="vSound" type="button"><svg class="i"><use id="vSoundUse" href="#i-spk"/></svg></button><button class="glass icon-btn" id="vInfo" type="button"><svg class="i"><use href="#i-info"/></svg></button></div></div>
<div class="v-bottom chrome"><div class="strip" id="strip"></div>
<div class="glass scrub" id="vScrub" hidden><span id="tCur">0:00</span><input type="range" id="rng" min="0" max="1000" value="0"><span id="tDur">0:00</span></div>
<span class="glass live-badge" id="vLive"><svg class="i"><use href="#i-live"/></svg>LIVE</span></div>
<div class="glass sheet" id="sheet"><div class="grab" id="grab"></div><div class="sheet-body" id="sheetBody"></div></div></div>
<div class="glass wc" id="wc"><button type="button" id="wMin" title="Minimize"><svg class="i" viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button><button type="button" id="wMax" title="Maximize"><svg class="i" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg></button><button type="button" id="wClose" class="x" title="Close"><svg class="i" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
<div class="glass toast" id="toast"></div></div>
<script src="lp.js"></script><script src="app.js"></script></body></html>
