<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc98a"/><stop offset="1" stop-color="#8a5fd1"/></linearGradient>
    <linearGradient id="sky2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fd6ff"/><stop offset="1" stop-color="#3b6fe0"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4z" fill="#8e8e93"/></marker>
  <clipPath id="c1"><rect x="75" y="80" width="180" height="180" rx="20"/></clipPath><clipPath id="c2"><rect x="945" y="80" width="180" height="180" rx="20"/></clipPath>
    <clipPath id="c3"><rect x="436" y="96" width="138" height="104" rx="10"/></clipPath></defs>
  <rect width="1200" height="430" rx="24" fill="#f5f5f7"/>

  <!-- step titles -->
  <g fill="#6e6e73" font-size="15" font-weight="600" letter-spacing="1.2" text-anchor="middle">
    <text x="165" y="48">ON THE IPHONE</text>
    <text x="600" y="48">ON WINDOWS</text>
    <text x="1035" y="48">IN LIVIO</text>
  </g>

  <!-- 1. iPhone: one Live Photo -->
  <rect x="75" y="80" width="180" height="180" rx="20" fill="url(#sky)"/>
  <circle cx="165" cy="150" r="30" fill="#fff" fill-opacity=".85"/>
  <path clip-path="url(#c1)" d="M75 232c40-34 70-20 100-4s56 12 80-8v40H75z" fill="#4b2e83" fill-opacity=".55"/>
  <g transform="translate(88 93)"><rect width="62" height="24" rx="12" fill="#000" fill-opacity=".45"/>
    <circle cx="13" cy="12" r="7" fill="none" stroke="#fff" stroke-width="1.8" stroke-dasharray="2 2.2"/><circle cx="13" cy="12" r="2.4" fill="#fff"/>
    <text x="26" y="16.5" fill="#fff" font-size="11.5" font-weight="700" letter-spacing="1">LIVE</text></g>
  <text x="165" y="300" fill="#1d1d1f" font-size="22" font-weight="700" text-anchor="middle">1 Live Photo</text>
  <text x="165" y="326" fill="#6e6e73" font-size="16" text-anchor="middle">a photo that moves</text>

  <!-- arrow 1 -->
  <line x1="290" y1="170" x2="385" y2="170" stroke="#8e8e93" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="338" y="150" fill="#6e6e73" font-size="14" text-anchor="middle">copy to PC</text>

  <!-- 2. Windows: two separate files -->
  <rect x="420" y="80" width="170" height="180" rx="16" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/>
  <rect x="436" y="96" width="138" height="104" rx="10" fill="url(#sky)"/>
  <circle cx="505" cy="140" r="20" fill="#fff" fill-opacity=".85"/>
  <text x="505" y="226" fill="#1d1d1f" font-size="18" font-weight="700" text-anchor="middle">IMG_4821.HEIC</text>
  <text x="505" y="248" fill="#6e6e73" font-size="15" text-anchor="middle">still image</text>

  <rect x="610" y="80" width="170" height="180" rx="16" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/>
  <rect x="626" y="96" width="138" height="104" rx="10" fill="#1d1d1f"/>
  <circle cx="695" cy="148" r="24" fill="#fff" fill-opacity=".92"/><path d="M687 136l22 12-22 12z" fill="#1d1d1f"/>
  <text x="695" y="226" fill="#1d1d1f" font-size="18" font-weight="700" text-anchor="middle">IMG_4821.MOV</text>
  <text x="695" y="248" fill="#6e6e73" font-size="15" text-anchor="middle">2 second video</text>
  <text x="600" y="300" fill="#1d1d1f" font-size="22" font-weight="700" text-anchor="middle">2 separate files</text>
  <text x="600" y="326" fill="#6e6e73" font-size="16" text-anchor="middle">Windows does not link them together</text>

  <!-- arrow 2 -->
  <line x1="815" y1="170" x2="905" y2="170" stroke="#8e8e93" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="860" y="150" fill="#6e6e73" font-size="14" text-anchor="middle">same name</text>

  <!-- 3. Livio: one Live Photo again -->
  <rect x="945" y="80" width="180" height="180" rx="20" fill="url(#sky)"/>
  <circle cx="1035" cy="150" r="30" fill="#fff" fill-opacity=".85"/>
  <path clip-path="url(#c2)" d="M945 232c40-34 70-20 100-4s56 12 80-8v40H945z" fill="#4b2e83" fill-opacity=".55"/>
  <g transform="translate(958 93)"><rect width="62" height="24" rx="12" fill="#000" fill-opacity=".45"/>
    <circle cx="13" cy="12" r="7" fill="none" stroke="#fff" stroke-width="1.8" stroke-dasharray="2 2.2"/><circle cx="13" cy="12" r="2.4" fill="#fff"/>
    <text x="26" y="16.5" fill="#fff" font-size="11.5" font-weight="700" letter-spacing="1">LIVE</text></g>
  <text x="1035" y="300" fill="#1d1d1f" font-size="22" font-weight="700" text-anchor="middle">1 Live Photo again</text>
  <text x="1035" y="326" fill="#6e6e73" font-size="16" text-anchor="middle">press and hold to play it</text>

  <text x="600" y="395" fill="#6e6e73" font-size="16" text-anchor="middle">Livio finds each photo and its video by their shared name and plays them together, like on the iPhone.</text>
</svg>
